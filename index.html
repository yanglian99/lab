<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Doom Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <section class="hud" aria-label="Game status">
      <div><strong>Mini Doom Lab</strong></div>
      <div>Health: <span id="health">100</span></div>
      <div>Ammo: <span id="ammo">30</span></div>
      <div>Kills: <span id="kills">0</span>/<span id="total">0</span></div>
    </section>

    <canvas id="game" width="960" height="540" aria-label="Mini Doom game canvas"></canvas>

    <section class="controls">
      <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move, <kbd>←</kbd><kbd>→</kbd> turn, <kbd>Space</kbd> fire, <kbd>R</kbd> restart.</p>
      <p id="message">Clear the dungeon before the imps catch you.</p>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
